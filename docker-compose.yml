version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: erag_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: erag_user
      POSTGRES_PASSWORD: erag_password
      POSTGRES_DB: erag_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - erag_network

  postgres_test:
    image: postgres:15-alpine
    container_name: erag_postgres_test
    restart: unless-stopped
    environment:
      POSTGRES_USER: erag_test
      POSTGRES_PASSWORD: erag_test
      POSTGRES_DB: erag_test_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    networks:
      - erag_network

  redis:
    image: redis:7-alpine
    container_name: erag_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - erag_network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: erag_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - erag_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erag_backend
    restart: unless-stopped
    command: /opt/venv/bin/uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://erag_user:erag_password@postgres:5432/erag_db
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - STORAGE_PROVIDER=LOCAL
      - STORAGE_PATH=/app/storage
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
    depends_on:
      - postgres
      - redis
      - qdrant
    networks:
      - erag_network

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erag_celery_worker
    restart: unless-stopped
    command: /opt/venv/bin/celery -A workers.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://erag_user:erag_password@postgres:5432/erag_db
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - STORAGE_PATH=/app/storage
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
    depends_on:
      - postgres
      - redis
      - qdrant
    networks:
      - erag_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: erag_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - erag_network

  nginx:
    image: nginx:alpine
    container_name: erag_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - erag_network

networks:
  erag_network:
    driver: bridge

volumes:
  postgres_data:
  postgres_test_data:
  redis_data:
  qdrant_data:
  frontend_node_modules:
